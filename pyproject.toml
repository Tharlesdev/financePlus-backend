[project]
name = "financeplus"
version = "1.0.0"
description = ""
authors = [
    {name = "Tharlesdev",email = "tharles291@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "flask (>=3.1.2,<4.0.0)",
    "flask-migrate (>=4.1.0,<5.0.0)",
    "flask-sqlalchemy (>=3.1.1,<4.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "sqlalchemy-utils (>=0.42.0,<0.43.0)",
    "pytest (>=8.4.2,<9.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "gunicorn (>=25.0.1,<26.0.0)",
    "flask-cors (>=6.0.2,<7.0.0)",
    "flasgger (>=0.9.7.1,<0.10.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "flask-limiter (>=4.1.1,<5.0.0)",
    "pandas (>=3.0.0,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "flask-apscheduler (>=1.13.1,<2.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pylint = "^3.3.8"
black = "^25.9.0"
isort = "^6.0.1"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


[tool.poetry]
name = "financeplus"
packages = [
    { include = "app", from = "src" }
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
